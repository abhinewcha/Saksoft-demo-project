
name: CICD Pipeline 

on:
  push:
    branches: [ "main" ]

jobs:
  compile:
    runs-on: self-hosted

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin' #Open-source and free  Eclipse Temurin is available under an open-source license
        cache: maven
    - name: Build with Maven
      run: mvn compile
      
  security-check:   # Security check using trivy 
    runs-on: self-hosted
    needs: compile

    steps:
    - uses: actions/checkout@v4
    - name: Trivy Installation
      run: |
        sudo apt-get install -y wget apt-transport-https gnupg lsb-release
        wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo apt-key add -
        echo deb https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main | sudo tee -a /etc/apt/sources.list.d/trivy.list
        sudo apt-get update -y
        sudo apt-get install -y trivy

    - name: Trivy FS Scan
      run: trivy fs --format table -o fs-report.json .

    - name: Gitleaks Installation
      run: sudo apt install gitleaks -y
    - name: Gitleaks Code Scan
      run: gitleaks detect source. -r gitleaks-report.json -f json

  test:    # This is the unit test case section
    runs-on: self-hosted

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin' #Open-source and free  Eclipse Temurin is available under an open-source license
        cache: maven
    - name: Unit Test Cases
      run: mvn test

  build_project_and_sonar_scan:    # This is a SonarQube test and builds the package
    runs-on: self-hosted
    needs: test

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin' #Open-source and free  Eclipse Temurin is available under an open-source license
        cache: maven
    - name: Build project
      run: mvn package
    - name: Upload JAR artifact # This will upload Date 22/01/2026
      uses: actions/upload-artifacts@v4
      with:
       name: app-jar
       path: target/*.jar    # This will upload the artifacts 

    - uses: actions/checkout@v4
      with:
        # Disabling shallow clones is recommended for improving the relevancy of reporting
        fetch-depth: 0
    - name: SonarQube Scan
      uses: SonarSource/sonarqube-scan-action@v7.0.0 # Ex: v4.1.0, or sha1, See the latest version at https://github.com/marketplace/actions/official-sonarqube-scan
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}

      # Check the Quality Gate status.
    - name: SonarQube Quality Gate check
      id: sonarqube-quality-gate-check
      uses: sonarsource/sonarqube-quality-gate-action@master
      with:
          pollingTimeoutSec: 600
      env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{vars.SONAR_HOST_URL }} #OPTIONAL

  build_docker_image_and_push: # This will build Docker image and push. Date: 22/01/2026
    runs-on: self-hosted
    needs: build_project_and_sonar_scan # After the sonar job, it should be run that why we are using needs

    steps:
    - uses: actions/checkout@v4
    - name: Download JAR artifact # This downloads the artifacts date:22/01/2026
      uses: actions/download-artifact@v4
      with:
       name: app-jar
       path: app # this will download JAR to the ./app folder	

    - name: Login to Docker Hub  # Go to the marketplace website and copy the Docker https://github.com/marketplace/actions/build-push-docker-images Date 22/01/2026
      uses: docker/login-action@v3
      with:
        username: ${{ vars.DOCKERHUB_USERNAME }} # Github user name add in the secureats 
        password: ${{ secrets.DOCKERHUB_TOKEN }} # Githu password

    - name: Set up QEMU   # It is required for x86 build ARM images, hence we are using QEMU, so that we can build any kind of image we can build with any issue
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build and push
      uses: docker/build-push-action@v6
      with:
        push: true
        tags: |
            abhinewcha/Saksoft-demo-project:latest
            abhinewcha/Saksoft-demo-project:${{ github.sha }} # We have to add our username and repo name      

    

      

      
      
      
      
      

      


 

    
      
